[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "gigbid"
version = "0.1.0"
description = "A human-controlled multi-agent freelancer copilot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<46",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "langchain[mcp]>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=2,<3",
  "numpy>=2,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=6,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "qdrant-client>=1.13,<2",
  "rank-bm25>=0.2,<1",
  "sqlalchemy>=2,<3",
  "sse-starlette>=2.2,<4",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
  "types-python-jose>=3.5,<4",
]
rag = [
  "sentence-transformers>=3.4,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "mcp_servers", "rag", "worker", "evals"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

