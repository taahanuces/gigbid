name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gigbid_test
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://gigbid:gigbid@localhost:5432/gigbid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=agent --cov=rag --cov=mcp_servers --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build
      - run: cd apps/web && PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web test:e2e

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce repository invariants
        run: |
          test ! -f .env
          test -z "$(find agent/nodes -name '*.py' -exec grep -l 'SYSTEM PROMPT' {} +)"
          git diff --exit-code -- gigsim/

